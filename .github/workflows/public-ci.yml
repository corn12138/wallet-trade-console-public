name: Public CI

on:
  push:
    branches: [main]
  pull_request:

# Public CI is deliberately read-only and has no production environment or
# secret-backed job. A public contribution can validate code but cannot deploy.
permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-release-policy:
    name: Public release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test public release boundary
        run: python3 -m unittest scripts/test_public_release_tools.py
      - name: Enforce public-source boundary
        run: python3 scripts/public_release_audit.py

  public-node-quality:
    name: Public Node quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/api-go/go.mod
          cache-dependency-path: services/api-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/strict/check-contract-source-parity.py --self-test
      - run: python3 scripts/strict/check-contract-source-parity.py
      - run: python3 scripts/strict/generate-execution-registry-contracts.py --self-test
      - run: python3 scripts/strict/generate-execution-registry-contracts.py --check
      - run: bash scripts/strict/realtime-e2e.sh
      - run: pnpm --filter @wallet-trade/database db:generate
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir contracts compile
      - run: pnpm --dir contracts test
      - run: pnpm --dir contracts sync-contracts
      - run: git diff --exit-code packages/shared/deployments packages/shared/src/web3/contract-addresses.generated.ts

  public-go-quality:
    name: Public Go quality
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_trade_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TOKEN_CANDLES_TEST_DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/wallet_trade_ci
      WEB3TX_TEST_DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/wallet_trade_ci
      BRIDGE_TEST_DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/wallet_trade_ci
      WEB3AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379
      # Replica tests require an isolated namespace even on disposable Redis.
      WEB3AUTH_TEST_REDIS_PREFIX: "public-ci:${{ github.run_id }}:${{ github.run_attempt }}:"
    defaults:
      run:
        working-directory: services/api-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/api-go/go.mod
          cache-dependency-path: services/api-go/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --filter @wallet-trade/database...
        working-directory: .
      - run: pnpm --filter @wallet-trade/database db:init
        working-directory: .
        env:
          DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/wallet_trade_ci
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  public-persistence:
    name: Public PostgreSQL 16 and push cancellation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: campaign_test_public_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/campaign_test_public_ci
      CAMPAIGN_TEST_DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/campaign_test_public_ci
      CAMPAIGN_LEGACY_TEST_DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/campaign_test_legacy_public_ci
      EXECUTION_REGISTRY_TEST_ADMIN_URL: postgresql://wallet:wallet@127.0.0.1:5432/postgres
      EXECUTION_REGISTRY_TEST_TEMPLATE: wallet_registry_ci
      WEB3TX_TEST_DATABASE_URL: postgresql://wallet:wallet@127.0.0.1:5432/wallet_reports_ci
      OUTBOX_TEST_ADMIN_URL: postgresql://wallet:wallet@127.0.0.1:5432/postgres
      OUTBOX_TEST_TEMPLATE: wallet_registry_ci
      OUTBOX_REPAIR_TEST_TEMPLATE: wallet_registry_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/api-go/go.mod
          cache-dependency-path: services/api-go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Initialize complete public databases
        run: |
          for database in campaign_test_legacy_public_ci wallet_registry_ci wallet_reports_ci; do
            PGPASSWORD=wallet createdb -h 127.0.0.1 -U wallet "$database"
          done
          for database in campaign_test_public_ci campaign_test_legacy_public_ci wallet_registry_ci wallet_reports_ci; do
            DATABASE_URL="postgresql://wallet:wallet@127.0.0.1:5432/$database" pnpm --filter @wallet-trade/database db:init
          done
          pnpm --filter @wallet-trade/database exec prisma migrate diff \
            --from-url "$DATABASE_URL" --to-schema-datamodel ./prisma/schema.prisma --exit-code
      - name: Reject initialization over an existing schema
        run: |
          if pnpm --filter @wallet-trade/database db:init > "$RUNNER_TEMP/bootstrap-repeat.log" 2>&1; then
            echo "Bootstrap unexpectedly accepted a nonempty schema"; exit 1
          fi
          grep -q 'public schema is not empty' "$RUNNER_TEMP/bootstrap-repeat.log"
      - name: Reject incompatible database encoding without creating tables
        run: |
          PGPASSWORD=wallet createdb -h 127.0.0.1 -U wallet --template=template0 \
            --encoding=SQL_ASCII --lc-collate=C --lc-ctype=C wallet_ascii_ci
          if DATABASE_URL=postgresql://wallet:wallet@127.0.0.1:5432/wallet_ascii_ci \
            pnpm --filter @wallet-trade/database db:init > "$RUNNER_TEMP/bootstrap-encoding.log" 2>&1; then
            echo "Bootstrap unexpectedly accepted SQL_ASCII"; exit 1
          fi
          grep -q 'requires a UTF8 database' "$RUNNER_TEMP/bootstrap-encoding.log"
          test "$(PGPASSWORD=wallet psql -X -h 127.0.0.1 -U wallet -d wallet_ascii_ci -Atc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public'")" = 0
      - name: Campaign, registry, outbox and persistent session invariants
        working-directory: services/api-go
        run: |
          go vet -tags integration ./...
          go test -tags integration -race -count=1 -p 1 ./internal/campaign/... ./cmd/campaign-legacy-import/...
          go test -race -count=1 -p 1 ./internal/executionregistry ./internal/web3events ./cmd/execution-registry ./internal/durableoutbox
          go test -tags integration -race -count=1 -p 1 ./internal/web3session/... ./cmd/api/... ./cmd/web3-sessions/...
      - name: Require migrated push recovery without unexpected skips
        working-directory: services/api-go
        run: |
          python3 ../../scripts/strict/require-go-tests.py --self-test
          status=0
          go test -race -count=1 -p 1 -json ./internal/campaign/eventpush > "$RUNNER_TEMP/eventpush.jsonl" || status=$?
          python3 ../../scripts/strict/require-go-tests.py "$RUNNER_TEMP/eventpush.jsonl" \
            --require internal/campaign/eventpush.TestMigratedPushRecoveryWithoutPublisherAndAcrossListenerLoss \
            --allow-skip internal/campaign/eventpush.TestPushCostAtSubscriptionCap || status=1
          exit "$status"
      - name: Cancellation through the actual API and Socket.IO
        env:
          CAMPAIGN_PUSH_E2E_ADMIN_URL: postgresql://wallet:wallet@127.0.0.1:5432/postgres
          CAMPAIGN_PUSH_E2E_TEMPLATE: wallet_registry_ci
          CAMPAIGN_PUSH_E2E_OUT: ${{ runner.temp }}/campaign-push-e2e
        run: python3 scripts/strict/campaign-push-cancel-e2e.py

  public-foundry:
    name: Public Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.6
      - run: forge build
        working-directory: contracts-foundry
      - run: forge test
        working-directory: contracts-foundry
